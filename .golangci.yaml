# golangci-lint configuration for pmox.
# v2 schema; default linters keep us aligned with the upstream baseline
# until a reason to diverge appears.

version: "2"

run:
  timeout: 3m

linters:
  # The default set (govet, errcheck, staticcheck, unused, ineffassign)
  # plus linters that matter for a codebase that is mostly HTTP/SSH/SFTP
  # client calls with explicit error wrapping and context threading.
  enable:
    - bodyclose    # HTTP response bodies must be closed
    - errorlint    # correct errors.Is/As usage and %w wrapping
    - contextcheck # context is propagated, not dropped
  settings:
    errcheck:
      # Restore the v1-era defaults for calls whose errors are
      # intentionally ignored across the codebase: deferred Close on
      # any io.Closer, terminal Fprint* writes, and best-effort
      # os.Remove in cleanup branches.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
