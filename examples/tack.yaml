# Example tack playbook for pmox launch --tack / pmox apply.
#
# Invoked by pmox as `tack run ./tack.yaml -c ssh://<user>@<ip> --ssh-key
# <identity> --auto-approve` after the launched VM reports an IP and
# pmox confirms SSH is reachable (tack itself is what shows the
# plan/apply confirmation on a standalone `pmox apply`; --auto-approve
# skips it for the launch-time hook, which is non-interactive).
# Requires the `tack` binary on PATH — install from
# https://github.com/tackhq/tack.
#
# Usage:
#   pmox launch --tack ./examples/tack.yaml web1
#   pmox apply web1          # re-run the same playbook later
#
# This minimal playbook installs htop via the built-in `apt` module.
# Run `tack modules` to list every built-in module (apt, copy, cron,
# file, systemd, template, user, ...), and `tack module <name>` for a
# module's parameters and example. See tack's own docs/examples at
# https://github.com/tackhq/tack.

name: pmox htop example
hosts: all

tasks:
  - name: Install htop
    apt:
      name: htop
      state: present
      update_cache: true
