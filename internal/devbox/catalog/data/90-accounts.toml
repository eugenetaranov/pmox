# devbox-setup catalog: the Accounts tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "gitid"
tab = "accounts"
label = "Git name and email"
needs = ["essentials"]
source = "git config --global user.name/email"

[[item.step]]
type = "legacy"

[[item]]
id = "gitcfg"
tab = "accounts"
label = "Git defaults (rebase pulls, auto upstream, delta diffs)"
needs = ["essentials"]
source = "git config --global · aliases st co br sw lg amend · ~/.config/git/ignore"

[[item.step]]
type = "legacy"

[[item]]
id = "sshkey"
tab = "accounts"
label = "SSH key (ed25519)"
source = "ssh-keygen → ~/.ssh/id_ed25519 (kept if present)"

[[item.step]]
type = "legacy"

[[item]]
id = "github"
tab = "accounts"
label = "GitHub login (forwarded agent, key or token)"
needs = ["essentials"]
source = "gh auth login · forwarded agent, ~/.ssh/id_ed25519 (gh ssh-key add) or a token"

[[item.step]]
type = "legacy"

[[item]]
id = "gitsign"
tab = "accounts"
label = "Sign commits with SSH"
needs = ["github"]
source = "git gpg.format=ssh · signing key on GitHub · ~/.config/git/allowed_signers"

[[item.step]]
type = "legacy"

[[item]]
id = "glab"
tab = "accounts"
label = "GitLab CLI (glab)"

[[item.step]]
type = "mise"
tools = ["glab@latest"]
