# devbox-setup catalog: the Accounts tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "gitid"
tab = "accounts"
label = "Git name and email"
needs = ["essentials"]
source = "git config --global user.name/email"

[[item.step]]
type = "git_config"
values = { "user.name" = "{{git_name}}", "user.email" = "{{git_email}}", "init.defaultBranch" = "main" }

[[item]]
id = "gitcfg"
tab = "accounts"
label = "Git defaults (rebase pulls, auto upstream, delta diffs)"
needs = ["essentials"]
source = "git config --global · aliases st co br sw lg amend · ~/.config/git/ignore"

[[item.step]]
type = "git_config"

[item.step.values]
"pull.rebase" = "true"
"rebase.autoStash" = "true"
"rebase.autoSquash" = "true"
"rebase.updateRefs" = "true"
"push.autoSetupRemote" = "true"
"push.default" = "current"
"fetch.prune" = "true"
"rerere.enabled" = "true"
"merge.conflictStyle" = "zdiff3"
"diff.algorithm" = "histogram"
"diff.colorMoved" = "default"
"branch.sort" = "-committerdate"
"column.ui" = "auto"
"commit.verbose" = "true"
"init.defaultBranch" = "main"
"core.excludesFile" = "~/.config/git/ignore"
"alias.st" = "status -sb"
"alias.co" = "checkout"
"alias.br" = "branch"
"alias.sw" = "switch"
"alias.lg" = "log --graph --oneline --decorate --all"
"alias.amend" = "commit --amend --no-edit"

# delta's diffs, when it is installed (CLI upgrades).
[[item.step]]
type = "git_config"
if_tool = "delta"

[item.step.values]
"core.pager" = "delta"
"interactive.diffFilter" = "delta --color-only"
"delta.navigate" = "true"
"delta.line-numbers" = "true"

[[item.step]]
type = "file"
src = "gitignore_global"
to = "~/.config/git/ignore"
if_absent = true

[[item]]
id = "sshkey"
tab = "accounts"
label = "SSH key (ed25519)"
source = "ssh-keygen → ~/.ssh/id_ed25519 (kept if present)"

[[item.step]]
type = "run"
cmd = 'mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh-keygen -q -t ed25519 -N "" -C "{{user}}@$(hostname)" -f ~/.ssh/id_ed25519'
as_user = true
creates = "~/.ssh/id_ed25519"

[[item]]
id = "github"
tab = "accounts"
label = "GitHub login (forwarded agent, key or token)"
needs = ["essentials"]
source = "gh auth login · forwarded agent, ~/.ssh/id_ed25519 (gh ssh-key add) or a token"

[[item.step]]
type = "legacy"

[[item]]
id = "gitsign"
tab = "accounts"
label = "Sign commits with SSH"
needs = ["github"]
source = "git gpg.format=ssh · signing key on GitHub · ~/.config/git/allowed_signers"

[[item.step]]
type = "legacy"

[[item]]
id = "glab"
tab = "accounts"
label = "GitLab CLI (glab)"

[[item.step]]
type = "mise"
tools = ["glab@latest"]

# Opt-in: the login user's sudo asks for their password, so an agent
# running as them can't sudo (and read the MCP tokens) unasked. pmox
# commands that use sudo on the VM then need that password too.
[[item]]
id = "sudopw"
tab = "accounts"
label = "sudo asks for your password (drops NOPASSWD; pmox's sudo commands then ask too)"
source = "sets a password if there is none · removes NOPASSWD from your /etc/sudoers.d rules"

[[item.step]]
type = "go:sudopw"

# Your own dotfiles, applied last so they win: cloned (or pulled) on every
# run, then the repo's install script, or stow.
[[item]]
id = "dotfiles"
tab = "accounts"
label = "Your dotfiles repo (~/.dotfiles: its install script, or stow)"
last = true
source = "git clone/pull · install.sh, bootstrap.sh or setup.sh, else stow each directory · runs last"

[[item.step]]
type = "apt"
packages = ["git", "stow"]

[[item.step]]
type = "go:dotfiles"
