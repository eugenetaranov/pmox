# devbox-setup catalog: the Languages tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "go"
tab = "lang"
label = "Go + gopls, delve, govulncheck, golangci-lint"

[[item.step]]
type = "mise"
tools = ["go@latest", "golangci-lint@latest", "go:golang.org/x/tools/gopls@latest", "go:github.com/go-delve/delve/cmd/dlv@latest", "go:golang.org/x/vuln/cmd/govulncheck@latest"]

[[item]]
id = "python"
tab = "lang"
label = "Python 3.13 + uv + ruff"

[[item.step]]
type = "mise"
tools = ["python@3.13", "uv@latest", "ruff@latest"]

[[item]]
id = "node"
tab = "lang"
label = "Node.js LTS + pnpm + TypeScript"

[[item.step]]
type = "mise"
tools = ["node@lts", "pnpm@latest", "npm:typescript@latest"]

[[item]]
id = "bun"
tab = "lang"
label = "Bun"

[[item.step]]
type = "mise"
tools = ["bun@latest"]

[[item]]
id = "deno"
tab = "lang"
label = "Deno"

[[item.step]]
type = "mise"
tools = ["deno@latest"]

[[item]]
id = "java"
tab = "lang"
label = "Java 25 (Temurin) + Maven + Gradle + Kotlin"

[[item.step]]
type = "mise"
tools = ["java@temurin-25", "maven@latest", "gradle@latest", "kotlin@latest"]

[[item]]
id = "rust"
tab = "lang"
label = "Rust (rustup) + rust-analyzer + cargo-binstall"
source = "mise use -g rust@stable cargo-binstall"

[[item.step]]
type = "mise"
tools = ["rust@stable", "cargo-binstall@latest"]

[[item.step]]
type = "run"
cmd = "mise exec rust -- rustup component add rust-analyzer"
as_user = true
check = "mise exec rust -- rustup component list --installed | grep -q '^rust-analyzer'"

[[item]]
id = "ruby"
tab = "lang"
label = "Ruby (builds from source ~5 min)"
needs = ["rubydeps"]

[[item.step]]
type = "mise"
tools = ["ruby@latest"]

[[item]]
id = "php"
tab = "lang"
label = "PHP + Composer"

[[item.step]]
type = "apt"
packages = ["php-cli", "php-mbstring", "php-xml", "php-curl", "php-zip", "php-sqlite3", "composer"]

[[item]]
id = "cpp"
tab = "lang"
label = "C/C++ (gcc clang cmake gdb)"
needs = ["essentials"]

[[item.step]]
type = "apt"
packages = ["clang", "clangd", "cmake", "ninja-build", "gdb", "pkg-config"]

[[item]]
id = "zig"
tab = "lang"
label = "Zig"

[[item.step]]
type = "mise"
tools = ["zig@latest"]

[[item]]
id = "dotnet"
tab = "lang"
label = ".NET SDK"

[[item.step]]
type = "mise"
tools = ["dotnet@latest"]
