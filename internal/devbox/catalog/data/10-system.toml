# devbox-setup catalog: the System tab.
# `legacy` steps run the bundled bash installer until the item is ported.

[[item]]
id = "etckeeper"
tab = "system"
label = "etckeeper (/etc history in git; install it first)"

[[item.step]]
type = "apt"
packages = ["etckeeper"]

[[item]]
id = "essentials"
tab = "system"
label = "Essentials (recommended)"

[[item.step]]
type = "apt"
packages = ["git", "curl", "wget", "ca-certificates", "unzip", "zip", "build-essential", "jq", "gh"]

[[item]]
id = "debug"
tab = "system"
label = "Admin and debug tools (network, disk, process)"
source = "apt install bind9-dnsutils mtr-tiny traceroute tcpdump iperf3 ethtool nmap iftop lsof strace ltrace sysstat iotop-c ncdu duf pv lnav netcat-openbsd socat rsync btop"

[[item.step]]
type = "apt"
packages = ["bind9-dnsutils", "mtr-tiny", "traceroute", "tcpdump", "iperf3", "ethtool", "nmap", "iftop", "lsof", "strace", "ltrace", "sysstat", "iotop-c", "ncdu", "duf", "pv", "lnav", "netcat-openbsd", "socat", "rsync", "btop"]

# sysstat ships disabled: without this, sar has no data.
[[item.step]]
type = "line"
to = "/etc/default/sysstat"
match = "^ENABLED="
line = 'ENABLED="true"'
if_exists = true

[[item.step]]
type = "systemctl"
unit = "sysstat"

[[item.step]]
type = "systemctl"
unit = "sysstat"
action = "restart"

[[item]]
id = "docker"
tab = "system"
label = "Docker Engine + Compose"
source = "apt docker-ce (download.docker.com repo) · log rotation, 10.200/16 networks · docker group = root"

[[item.step]]
type = "apt"
packages = ["ca-certificates", "curl"]

[[item.step]]
type = "apt_repo"
name = "docker"
key_url = "https://download.docker.com/linux/ubuntu/gpg"
key_fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
source = """
Types: deb
URIs: https://download.docker.com/linux/ubuntu
Suites: {{codename}}
Components: stable
Architectures: {{arch}}
Signed-By: {{keyring}}
"""

# Log rotation and address pools, before the engine first starts.
[[item.step]]
type = "go:docker_daemon"

[[item.step]]
type = "apt"
packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]

[[item.step]]
type = "systemctl"
unit = "docker"

[[item.step]]
type = "run"
cmd = "usermod -aG docker {{user}}"
check = "id -nG {{user}} | tr ' ' '\\n' | grep -qx docker"
text = "{{user}} is now in the docker group: log in again (or run 'newgrp docker'). VS Code and Cursor remote servers keep the old groups until restarted: run 'Remote-SSH: Kill VS Code Server on Host' from the editor."

[[item]]
id = "podman"
tab = "system"
label = "Podman (rootless) + skopeo + buildah"

[[item.step]]
type = "apt"
packages = ["podman", "uidmap", "slirp4netns", "passt", "skopeo", "buildah"]

[[item]]
id = "ctools"
tab = "system"
label = "Container tools (lazydocker, dive, hadolint, crane, cosign)"
needs = ["docker"]

[[item.step]]
type = "mise"
tools = ["lazydocker@latest", "dive@latest", "hadolint@latest", "crane@latest", "cosign@latest"]

[[item]]
id = "tailscale"
tab = "system"
label = "Tailscale"
source = "curl tailscale.com/install.sh · then tailscale up"

[[item.step]]
type = "run"
cmd = "curl -fsSL https://tailscale.com/install.sh | sh"
check = "command -v tailscale"
unverified = "Tailscale's own installer, which adds its signed apt repository"

# With the auth key typed this run; without one, `sudo tailscale up` later.
[[item.step]]
type = "go:tailscale_up"

[[item]]
id = "netfs"
tab = "system"
label = "NFS + SMB clients"

[[item.step]]
type = "apt"
packages = ["nfs-common", "cifs-utils", "autofs"]

[[item]]
id = "monitoring"
tab = "system"
label = "node_exporter (localhost:9100) + glances"
needs = ["mise"]
source = "apt prometheus-node-exporter · mise pipx:glances"

[[item.step]]
type = "apt"
packages = ["prometheus-node-exporter"]

# Debian's default listens on every interface.
[[item.step]]
type = "file"
src = "prometheus-node-exporter.default"
to = "/etc/default/prometheus-node-exporter"

[[item.step]]
type = "systemctl"
unit = "prometheus-node-exporter"
action = "restart"

[[item.step]]
type = "mise"
tools = ["uv@latest", "pipx:glances"]

[[item]]
id = "devlimits"
tab = "system"
label = "Dev limits: inotify watches, open files, map count"
source = "/etc/sysctl.d, limits.d, system.conf.d: 60-devbox.conf"

[[item.step]]
type = "file"
src = "sysctl-devbox.conf"
to = "/etc/sysctl.d/60-devbox.conf"

[[item.step]]
type = "file"
src = "limits-devbox.conf"
to = "/etc/security/limits.d/60-devbox.conf"

[[item.step]]
type = "file"
src = "systemd-devbox.conf"
to = "/etc/systemd/system.conf.d/60-devbox.conf"

[[item.step]]
type = "run"
cmd = "sysctl --system >/dev/null && systemctl daemon-reexec"
on_change = true

[[item]]
id = "zram"
tab = "system"
label = "Compressed swap in RAM (zram)"
source = "apt systemd-zram-generator · zram0 = half of RAM, max 8 GB"

[[item.step]]
type = "apt"
packages = ["systemd-zram-generator"]

[[item.step]]
type = "file"
src = "zram-generator.conf"
to = "/etc/systemd/zram-generator.conf"

[[item.step]]
type = "sysctl"
src = "sysctl-zram.conf"
to = "/etc/sysctl.d/61-zram.conf"

[[item.step]]
type = "systemctl"
action = "daemon-reload"

[[item.step]]
type = "systemctl"
unit = "systemd-zram-setup@zram0"
action = "restart"

[[item]]
id = "journald"
tab = "system"
label = "Cap the journal at 200 MB"
source = "/etc/systemd/journald.conf.d/60-devbox.conf"

[[item.step]]
type = "file"
src = "journald-devbox.conf"
to = "/etc/systemd/journald.conf.d/60-devbox.conf"

[[item.step]]
type = "systemctl"
unit = "systemd-journald"
action = "restart"

[[item]]
id = "tzlocale"
tab = "system"
label = "Timezone + en_US.UTF-8 locale"
source = "timedatectl set-timezone · locale-gen · apt locales-all"

[[item.step]]
type = "go:timezone"

[[item.step]]
type = "apt"
packages = ["locales", "locales-all"]

[[item.step]]
type = "run"
cmd = "locale-gen en_US.UTF-8 && update-locale LANG=en_US.UTF-8"
check = "grep -qx 'LANG=en_US.UTF-8' /etc/default/locale && locale -a | grep -qix en_US.utf8"

[[item]]
id = "autoupdates"
tab = "system"
label = "Automatic security updates (no auto-reboot)"
source = "unattended-upgrades · undoes pmox's boot-time switch-off"

[[item.step]]
type = "apt"
packages = ["unattended-upgrades"]

[[item.step]]
type = "file"
src = "apt-20auto-upgrades"
to = "/etc/apt/apt.conf.d/20auto-upgrades"

[[item.step]]
type = "file"
src = "apt-52devbox"
to = "/etc/apt/apt.conf.d/52devbox"

# pmox's bootcmd turns the timers off at every boot unless this exists.
[[item.step]]
type = "run"
cmd = "install -d -m 0755 /etc/devbox-setup && touch /etc/devbox-setup/auto-upgrades"
creates = "/etc/devbox-setup/auto-upgrades"

[[item.step]]
type = "systemctl"
unit = "apt-daily.timer"

[[item.step]]
type = "systemctl"
unit = "apt-daily-upgrade.timer"

[[item.step]]
type = "note"
text = "This VM's cloud-init turns automatic updates off at every boot (launched by an older pmox): after a reboot, run 'sudo devbox-setup --yes' again."
when = "ud=/var/lib/cloud/instance/user-data.txt; [ -r $ud ] && grep -qF 'systemctl disable --now apt-daily.timer' $ud && ! grep -qF /etc/devbox-setup/auto-upgrades $ud"

[[item]]
id = "needrestart"
tab = "system"
label = "needrestart: restart services quietly after apt"
source = "/etc/needrestart/conf.d/devbox.conf · no kernel pop-ups"

[[item.step]]
type = "apt"
packages = ["needrestart"]

[[item.step]]
type = "file"
src = "needrestart-devbox.conf"
to = "/etc/needrestart/conf.d/devbox.conf"

[[item]]
id = "sshharden"
tab = "system"
label = "SSH: keys only, no root login (advanced)"
source = "/etc/ssh/sshd_config.d/10-devbox.conf · refuses if you have no authorized key"

# Refuses when the user has no SSH key; rolls back a config sshd rejects.
[[item.step]]
type = "go:sshharden"

[[item]]
id = "ufw"
tab = "system"
label = "Firewall: only SSH, Tailscale, mosh in (advanced)"
source = "ufw · note: Docker's published ports bypass it"

[[item.step]]
type = "apt"
packages = ["ufw"]

[[item.step]]
type = "go:ufw"

[[item.step]]
type = "note"
text = "ufw: ports published by Docker (-p) bypass the firewall; bind them to 127.0.0.1 or use the DOCKER-USER chain."
when = "command -v docker"

[[item]]
id = "fail2ban"
tab = "system"
label = "fail2ban: ban SSH brute force (internet-facing VMs)"
source = "apt fail2ban · sshd jail · Tailscale IPs never banned"

[[item.step]]
type = "apt"
packages = ["fail2ban", "python3-systemd"]

[[item.step]]
type = "file"
src = "fail2ban-devbox.local"
to = "/etc/fail2ban/jail.d/devbox.local"

[[item.step]]
type = "systemctl"
unit = "fail2ban"

[[item.step]]
type = "systemctl"
unit = "fail2ban"
action = "restart"

[[item]]
id = "registries"
tab = "system"
scope = "user"
label = "Container registry logins (ghcr.io, …)"
needs = ["docker"]
after = ["github"]
source = "docker login per registry · ~/.docker/config.json"

# After the GitHub login: ghcr.io can use gh's token.
[[item.step]]
type = "go:registries"

# Behind a corporate proxy: apt, Docker (daemon and client), mise and
# login shells go through it. Applied before the run's apt transaction.
[[item]]
id = "proxy"
tab = "system"
label = "Corporate proxy (apt, Docker, mise, shells)"
source = "apt.conf.d/95devbox-proxy · /etc/environment · docker.service.d/proxy.conf · ~/.docker/config.json"

[[item.step]]
type = "go:proxy"

# An internal CA bundle in the system trust store (curl, apt, git, Docker),
# with Node, Python requests and the AWS CLI pointed at it by shell.sh.
[[item]]
id = "corpca"
tab = "system"
label = "Internal CA bundle (system trust store; Node, Python, AWS CLI)"
source = "a PEM path on the VM, or an https URL + sha256 · update-ca-certificates"

[[item.step]]
type = "go:corpca"
