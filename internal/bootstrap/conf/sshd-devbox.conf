# Written by devbox-setup ("SSH: keys only"). Sorts before 50-cloud-init.conf:
# in sshd the first value wins. Delete this file and reload ssh to undo.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
MaxAuthTries 3
ClientAliveInterval 60
ClientAliveCountMax 3
