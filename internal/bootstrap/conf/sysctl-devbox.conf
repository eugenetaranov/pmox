# Written by devbox-setup ("Dev limits"). File watchers (Vite, jest, kind,
# VS Code Remote) run out of inotify instances at the default 128.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Elasticsearch, OpenSearch and some JVM workloads need this.
vm.max_map_count = 262144
# iotop's IO% column.
kernel.task_delayacct = 1
